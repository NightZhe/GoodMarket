name: Android

# 乾淨環境建 Android App 殼（Capacitor）：
#   - PR 與任何 push：debug APK，上傳成 workflow artifact（下載後傳到手機就能裝，不用本機有 Android SDK）
#   - 推 main 或手動觸發：另外建正式版 AAB＋同簽章 APK，但只有 repo 設了上傳金鑰 secrets 才會簽章與上傳 artifact
#     （ANDROID_KEYSTORE_BASE64＝`base64 -i upload.jks`、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD）
# versionCode 取 git rev-list --count HEAD（與 scripts/archive-android.sh 同一來源，main 每個 commit 都變大）。
# VITE_* 用 repo secrets；fork 的 PR 拿不到，會以空值 build（前端對缺少設定有降級），APK 仍可產出但接不上正式站。

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode 要算完整 commit 數
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}
      - run: npx cap sync android
      - name: Bundle 不得含本機 Supabase 網址
        run: |
          if grep -l "127\.0\.0\.1:54321" android/app/src/main/assets/public/assets/*.js; then
            echo "bundle 內嵌本機 Supabase 網址" >&2; exit 1
          fi
      - name: gradle assembleDebug
        working-directory: android
        run: |
          export ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
          echo "versionCode=$ANDROID_VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: goodmarket-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-aab:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 檢查上傳金鑰 secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::沒有 ANDROID_KEYSTORE_BASE64 secret，略過正式版建置"; fi
      - if: steps.signing.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.signing.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - if: steps.signing.outputs.present == 'true'
        run: npm ci
      - if: steps.signing.outputs.present == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}
      - if: steps.signing.outputs.present == 'true'
        run: npx cap sync android
      - if: steps.signing.outputs.present == 'true'
        name: Bundle 必須只含正式站
        run: |
          A=android/app/src/main/assets/public/assets
          if grep -l "127\.0\.0\.1:54321" "$A"/*.js; then echo "bundle 內嵌本機 Supabase 網址" >&2; exit 1; fi
          grep -l "hvecvwzpummmlsakxqbw.supabase.co" "$A"/*.js >/dev/null || { echo "bundle 沒有正式站 Supabase 網域（VITE_SUPABASE_URL secret 缺？）" >&2; exit 1; }
      - if: steps.signing.outputs.present == 'true'
        name: gradle bundleRelease assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          export ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
          echo "versionCode=$ANDROID_VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goodmarket-release-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
